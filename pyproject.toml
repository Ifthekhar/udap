[project]
name = "udap"
version = "0.1.0"
description = "AI-powered universal digital accessibility platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.8.0",
  "python-docx>=1.1.2",
  "pymupdf>=1.24.0",
  "pypdf>=4.3.0",
]

[project.scripts]
udap-analyse = "udap.cli:main"

[project.optional-dependencies]
dev = [
  "httpx2>=0.28.0",
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
